[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kclab"
version = "0.1.0"
description = "PQC readiness prototype: KC-LAB-PQC-2026-v1 benchmark harness and the PQRA instrument"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=46",      # OpenSSL with ML-KEM / ML-DSA (primary IUT + classical)
  "pqcrypto>=1.0",         # ML-KEM-512 fallback and cross-check IUT
  "psutil>=5.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
oqs = ["liboqs-python>=0.12"]
test = ["pytest>=8"]

[project.scripts]
kclab = "kclab.cli:main"

[tool.setuptools.packages.find]
include = ["kclab*"]

[tool.setuptools.package-data]
"kclab.pqra" = ["instrument.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
