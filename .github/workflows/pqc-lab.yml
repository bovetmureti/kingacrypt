name: pqc-lab tests

on:
  push:
    paths: ["pqc-lab/**", ".github/workflows/pqc-lab.yml"]
  pull_request:
    paths: ["pqc-lab/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pqc-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Smoke session (sandbox)
        run: python -m kclab run --quick
